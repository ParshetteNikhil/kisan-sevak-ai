name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add package-lock.json [skip ci]"
            git push
          fi

      - name: Type check
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Summarise type errors
        if: always()
        run: |
          echo "### Type errors: $(grep -c 'error TS' typecheck.log || true)" >> "$GITHUB_STEP_SUMMARY"
          grep 'error TS' typecheck.log | head -100 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
