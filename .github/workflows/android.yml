name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with upload key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set – release builds are unsigned" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kisaan-sevak-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  launch-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kisaan-sevak-android-${{ github.run_number }}
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator with Chrome + Play services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash -c 'set -x; adb install -r "$(find out -path "*debug*" -name "*.apk" | head -1)"; adb shell pm list packages | grep -E "chrome|webview" > browsers.txt; adb shell dumpsys package com.android.chrome | grep -m1 versionName >> browsers.txt; adb logcat -c; adb shell monkey -p com.kisaansevak.app -c android.intent.category.LAUNCHER 1; sleep 30; adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity|ResumedActivity" > top.txt; adb exec-out screencap -p > launch-screenshot.png; adb logcat -d -v brief > logcat.txt; true'

      - name: Report
        if: always()
        run: |
          {
            echo '## Launch test'
            echo '### Browsers on device'; echo '```'; cat browsers.txt 2>/dev/null; echo '```'
            echo '### Foreground activity after 30s'; echo '```'; cat top.txt 2>/dev/null; echo '```'
            echo '### App / browser log lines'; echo '```'
            grep -E 'FATAL|AndroidRuntime: |kisaansevak|TrustedWeb|CustomTabs|androidbrowserhelper|TwaLauncher|ActivityTaskManager: START|Displayed|cr_' logcat.txt 2>/dev/null | grep -v 'ziparchive\|Telephony' | tail -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'FATAL EXCEPTION' logcat.txt; then echo "::error::App crashed on launch"; exit 1; fi
          if ! grep -qiE 'chrome|kisaansevak|webview' top.txt; then echo "::error::Neither the app nor Chrome is in the foreground after launch"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test-${{ github.run_number }}
          path: |
            logcat.txt
            top.txt
            launch-screenshot.png
          if-no-files-found: ignore

      - name: Upload launch screenshot for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f launch-screenshot.png ] || exit 0
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Android app (latest build)" --notes "Builds in progress" --target "${{ github.sha }}"
          gh release upload android-latest launch-screenshot.png --clobber

  publish:
    needs: launch-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kisaan-sevak-android-${{ github.run_number }}
          path: android/app/build/outputs

      - name: Publish installable APK (GitHub release "android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          ls -R android/app/build/outputs | head -30
          if [ "$SIGNED" = "true" ]; then
            cp "$(find android/app/build/outputs -path '*release*' -name '*.apk' | head -1)" kisaan-sevak.apk
            NOTE="Signed build #${{ github.run_number }} (opens full-screen)."
          else
            cp "$(find android/app/build/outputs -path '*debug*' -name '*.apk' | head -1)" kisaan-sevak.apk
            NOTE="Test build #${{ github.run_number }} (debug-signed; may show an address bar until signing secrets are added)."
          fi
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android app (latest build)" --notes "$NOTE" --target "${{ github.sha }}"
          gh release upload android-latest kisaan-sevak.apk --clobber
          gh release edit android-latest --notes "$NOTE Passed the emulator launch test. Install: on your Android phone, tap kisaan-sevak.apk below, then allow installing from your browser if asked."
