name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with upload key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set – release builds are unsigned" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kisaan-sevak-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish installable APK (GitHub release "android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk kisaan-sevak.apk
            NOTE="Signed build #${{ github.run_number }} (opens full-screen)."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk kisaan-sevak.apk
            NOTE="Test build #${{ github.run_number }} (debug-signed; may show an address bar until signing secrets are added)."
          fi
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android app (latest build)" --notes "Install: open this page on your Android phone and tap kisaan-sevak.apk." --target "${{ github.sha }}"
          gh release upload android-latest kisaan-sevak.apk --clobber
          gh release edit android-latest --notes "$NOTE Install: on your Android phone, tap kisaan-sevak.apk below, then allow installing from your browser if asked."

  launch-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kisaan-sevak-android-${{ github.run_number }}
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            find out -name '*.apk' | sort
            adb install -r "$(find out -path '*debug*' -name '*.apk' | head -1)"
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.kisaansevak.app | tee resolve.txt
            adb logcat -c
            adb shell monkey -p com.kisaansevak.app -c android.intent.category.LAUNCHER 1 | tee monkey.txt
            sleep 20
            adb logcat -d -v brief > logcat.txt || true
            { echo '## Launch test'; echo '```'; cat resolve.txt monkey.txt; echo '--- errors ---'; grep -E 'AndroidRuntime|FATAL|kisaansevak|ActivityTaskManager|androidbrowserhelper|TrustedWebActivity|Exception' logcat.txt | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-logcat-${{ github.run_number }}
          path: logcat.txt
          if-no-files-found: ignore
