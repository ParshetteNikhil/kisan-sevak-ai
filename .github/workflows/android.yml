name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with upload key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set – release builds are unsigned" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kisaan-sevak-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish installable APK (GitHub release "android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk kisaan-sevak.apk
            NOTE="Signed build #${{ github.run_number }} (opens full-screen)."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk kisaan-sevak.apk
            NOTE="Test build #${{ github.run_number }} (debug-signed; may show an address bar until signing secrets are added)."
          fi
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android app (latest build)" --notes "Install: open this page on your Android phone and tap kisaan-sevak.apk." --target "${{ github.sha }}"
          gh release upload android-latest kisaan-sevak.apk --clobber
          gh release edit android-latest --notes "$NOTE Install: on your Android phone, tap kisaan-sevak.apk below, then allow installing from your browser if asked."
